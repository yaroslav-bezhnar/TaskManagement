services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=task_management
      - POSTGRES_USER=task_user
      - POSTGRES_PASSWORD=task_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U task_user']
      interval: 5s
      retries: 5

volumes:
  pgdata:
    name: taskmanagement_pgdata
